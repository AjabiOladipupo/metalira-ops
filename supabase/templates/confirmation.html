<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #ffffff;
      font-family: Inter, Arial, sans-serif;
      color: #0a0a0a;
    "
  >
    <div style="max-width: 480px; margin: 0 auto">
      <p style="margin: 0 0 24px; font-size: 18px; font-weight: 500">Metalira <b>Ops</b></p>
      <h1 style="margin: 0 0 12px; font-size: 25px; line-height: 1.2">Confirm your email</h1>
      <p style="margin: 0 0 24px; font-size: 15px; line-height: 1.5">
        Confirm this address to finish creating your company's Metalira Ops account.
      </p>
      <p style="margin: 0 0 24px">
        <a
          href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/app"
          style="
            display: inline-block;
            padding: 12px 18px;
            border-radius: 8px;
            background: #0a0a0a;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
          "
          >Confirm email</a
        >
      </p>
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #52525b">
        The link works once and expires in 1 hour. If you did not sign up, ignore this email.
      </p>
    </div>
  </body>
</html>
