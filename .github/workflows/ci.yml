name: CI

# The repository is public, so Actions minutes are free. Every pull request push and every
# push to main runs all three jobs: `check` (typecheck, lint, unit tests), `rls` (database and
# isolation tests) and `e2e` (Playwright). Agents run the database and screen tests here
# instead of queueing for the one local Supabase stack. Docs-only changes skip CI.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "fixtures/lira/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "fixtures/lira/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Unit project only; the RLS suite needs Docker and runs in the rls job.
      - run: pnpm test

  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pinned CLI from devDependencies. Only the services the RLS suite needs (Storage for the
      # org-assets bucket policies).
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor,realtime
      # Definition of done: migrations apply cleanly to a fresh database.
      - name: Reset database
        run: pnpm db:reset
      - name: Check generated types match the migrations
        run: |
          pnpm db:types
          git diff --exit-code -- src/types/db.ts
      - name: RLS and isolation tests
        run: pnpm test:rls
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Auth flows need the local stack, Mailpit included (sign-up confirmation and magic-link
      # emails) and Storage (company logo upload). playwright.config.ts reads the URL and
      # publishable key from `supabase status`, and the specs read the secret key the same way, so
      # nothing secret is set here.
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
      - run: pnpm test:e2e tests/e2e/offline.spec.ts --project=mobile-390 --repeat-each=30 --retries=0 --workers=2
        env:
          # A fixed dummy key for the app under test, so the People specs can save and reveal
          # bank details and NIN against the throwaway local database. Not a real key: it is
          # base64 of "e2e-test-key-not-a-secret-000000". Never reuse it anywhere else.
          PII_ENCRYPTION_KEY: ZTJlLXRlc3Qta2V5LW5vdC1hLXNlY3JldC0wMDAwMDA=
      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
